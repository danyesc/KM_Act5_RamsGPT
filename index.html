<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RamsGPT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --royal: #003594;
    --sol: #FFD100;
    --ice: #EAF0FA;
    --line: #C5D2EA;
    --ink: #10203F;
    --muted: #5A6A8A;
    --head: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--body);
    color: var(--ink);
    background: var(--ice);
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--royal);
    color: #fff;
    padding: 28px 20px 22px;
    border-bottom: 6px solid var(--sol);
  }
  .wrap { max-width: 720px; margin: 0 auto; width: 100%; }
  h1 {
    font-family: var(--head);
    font-size: clamp(44px, 9vw, 72px);
    line-height: .95;
    margin: 0;
    letter-spacing: .01em;
  }
  h1 span { color: var(--sol); }
  header p { margin: 8px 0 0; color: #CBD8F2; font-size: 16px; }

  main { flex: 1; min-height: 0; display: flex; padding: 0 12px; }
  .chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 720px;
    margin: 0 auto;
    width: 100%;
    min-height: 0;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 24px 4px 12px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg { max-width: 86%; line-height: 1.5; font-size: 16px; white-space: pre-line; }
  .msg.user {
    align-self: flex-end;
    background: var(--royal);
    color: #fff;
    padding: 10px 14px;
    border-radius: 16px 16px 4px 16px;
  }
  .msg.bot {
    align-self: flex-start;
    background: #fff;
    border: 1px solid var(--line);
    border-left: 5px solid var(--royal);
    padding: 10px 14px 12px;
    border-radius: 4px 16px 16px 4px;
  }
  .msg.error { border-left-color: #B3261E; }
  .source {
    display: inline-block;
    margin-top: 8px;
    padding: 2px 8px;
    background: var(--sol);
    color: var(--ink);
    font-size: 12px;
    font-weight: 600;
    border-radius: 3px;
  }

  .welcome { align-self: stretch; padding: 4px 0 8px; }
  .welcome p { margin: 0 0 12px; font-size: 18px; font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: inherit;
    font-size: 15px;
    padding: 8px 14px;
    background: #fff;
    color: var(--royal);
    border: 1.5px solid var(--royal);
    border-radius: 999px;
    cursor: pointer;
  }
  .chip:hover { background: var(--royal); color: #fff; }

  .typing { display: inline-flex; gap: 4px; padding: 6px 2px; }
  .typing i {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--royal); opacity: .35;
    animation: pulse 1s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes pulse { 50% { opacity: 1; } }

  form {
    display: flex;
    gap: 8px;
    padding: 12px 0 20px;
    border-top: 1px solid var(--line);
  }
  input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 16px;
    padding: 13px 14px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
  }
  input::placeholder { color: var(--muted); }
  button.send {
    font: inherit;
    font-weight: 600;
    padding: 0 22px;
    background: var(--sol);
    color: var(--royal);
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  button.send:hover:not(:disabled) { filter: brightness(.95); }
  button:disabled, input:disabled { opacity: .55; cursor: not-allowed; }
  :focus-visible { outline: 3px solid var(--royal); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .typing i { animation: none; opacity: .7; }
  }
</style>
</head>

<body>
  <header>
    <div class="wrap">
      <h1>Rams<span>GPT</span></h1>
      <p>Ask about Rams history, championships, players and SoFi Stadium.</p>
    </div>
  </header>

  <main>
    <div class="chat">
      <div id="log" role="log" aria-live="polite">
        <div class="welcome" id="welcome">
          <p>What do you want to know about the Rams?</p>
          <div class="chips">
            <button class="chip" type="button">When did the Rams win the Super Bowl?</button>
            <button class="chip" type="button">Where have the Rams played?</button>
            <button class="chip" type="button">Who was on the Greatest Show on Turf?</button>
            <button class="chip" type="button">Tell me about SoFi Stadium</button>
          </div>
        </div>
      </div>

      <form id="form" autocomplete="off">
        <input id="question" type="text" placeholder="Ask something about the Rams" aria-label="Your question">
        <button class="send" type="submit" id="send">Send</button>
      </form>
    </div>
  </main>

  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("question");
    const sendBtn = document.getElementById("send");
    const welcome = document.getElementById("welcome");

    function addMessage(role, text, source, isError) {
      const el = document.createElement("div");
      el.className = "msg " + role + (isError ? " error" : "");
      el.textContent = text; // textContent avoids injecting HTML from user or server text
      if (source) {
        const tag = document.createElement("div");
        tag.className = "source";
        tag.textContent = "Source: " + source;
        el.appendChild(tag);
      }
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    function addTyping() {
      const el = document.createElement("div");
      el.className = "msg bot";
      el.innerHTML = '<span class="typing" aria-label="RamsGPT is typing"><i></i><i></i><i></i></span>';
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    function setBusy(busy) {
      input.disabled = busy;
      sendBtn.disabled = busy;
      if (!busy) input.focus();
    }

    async function ask(question) {
      if (welcome) welcome.remove();
      addMessage("user", question);
      setBusy(true);
      const typing = addTyping();

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();
        typing.remove();
        addMessage("bot", data.answer || "I couldn't find an answer to that.", data.source);
      } catch (err) {
        typing.remove();
        addMessage("bot", "Something went wrong reaching RamsGPT. Check your connection and try again.", null, true);
      } finally {
        setBusy(false);
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;
      input.value = "";
      ask(q);
    });

    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => ask(chip.textContent));
    });
  </script>
</body>
</html>
